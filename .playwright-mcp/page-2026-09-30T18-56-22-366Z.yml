            - generic [ref=f24e163]:
              - paragraph [ref=f24e164]: Wrist-worn sensing gives you an inertial stream and a coarse spatial stream that do not describe the same thing. The inertial channel is fast and noisy; the spatial channel is slow but grounded. Treating them as one flat feature vector throws away the structure of the problem.
              - paragraph [ref=f24e165]: Two encoders run independently — a temporal branch over the inertial signal and a convolutional branch over the spatial frames — and are merged through a gated cross-modal fusion layer that learns how much to trust each modality per timestep. Sequences are variable-length, so batching is handled around padding and masking rather than truncation.
              - paragraph [ref=f24e166]: Training runs under mixed precision with cosine learning-rate scheduling and label smoothing — the last of which matters here, because gesture boundaries in self-recorded data are inherently fuzzy.
              - list [ref=f24e167]:
                - listitem [ref=f24e168]:
                  - generic [ref=f24e170]: Dual-encoder multimodal architecture
                - listitem [ref=f24e171]:
                  - generic [ref=f24e173]: Gated cross-modal fusion between inertial and spatial streams
                - listitem [ref=f24e174]:
                  - generic [ref=f24e176]: Variable-length sequence handling up to 700 timesteps
                - listitem [ref=f24e177]:
                  - generic [ref=f24e179]: Mixed precision training with cosine LR scheduling
                - listitem [ref=f24e180]:
                  - generic [ref=f24e182]: Label smoothing for ambiguous gesture boundaries
