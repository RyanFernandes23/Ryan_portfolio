            - generic [ref=f23e176]:
              - paragraph [ref=f23e177]: Wrist-worn sensing gives you an inertial stream and a coarse spatial stream that do not describe the same thing. The inertial channel is fast and noisy; the spatial channel is slow but grounded. Treating them as one flat feature vector throws away the structure of the problem.
              - paragraph [ref=f23e178]: Two encoders run independently — a temporal branch over the inertial signal and a convolutional branch over the spatial frames — and are merged through a gated cross-modal fusion layer that learns how much to trust each modality per timestep. Sequences are variable-length, so batching is handled around padding and masking rather than truncation.
              - paragraph [ref=f23e179]: Training runs under mixed precision with cosine learning-rate scheduling and label smoothing — the last of which matters here, because gesture boundaries in self-recorded data are inherently fuzzy.
              - list [ref=f23e180]:
                - listitem [ref=f23e181]:
                  - generic [ref=f23e183]: Dual-encoder multimodal architecture
                - listitem [ref=f23e184]:
                  - generic [ref=f23e186]: Gated cross-modal fusion between inertial and spatial streams
                - listitem [ref=f23e187]:
                  - generic [ref=f23e189]: Variable-length sequence handling up to 700 timesteps
                - listitem [ref=f23e190]:
                  - generic [ref=f23e192]: Mixed precision training with cosine LR scheduling
                - listitem [ref=f23e193]:
                  - generic [ref=f23e195]: Label smoothing for ambiguous gesture boundaries
