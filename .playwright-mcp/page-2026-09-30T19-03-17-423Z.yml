            - generic [ref=f25e176]:
              - paragraph [ref=f25e177]: Wrist-worn sensing gives you an inertial stream and a coarse spatial stream that do not describe the same thing. The inertial channel is fast and noisy; the spatial channel is slow but grounded. Treating them as one flat feature vector throws away the structure of the problem.
              - paragraph [ref=f25e178]: Two encoders run independently — a temporal branch over the inertial signal and a convolutional branch over the spatial frames — and are merged through a gated cross-modal fusion layer that learns how much to trust each modality per timestep. Sequences are variable-length, so batching is handled around padding and masking rather than truncation.
              - paragraph [ref=f25e179]: Training runs under mixed precision with cosine learning-rate scheduling and label smoothing — the last of which matters here, because gesture boundaries in self-recorded data are inherently fuzzy.
              - list [ref=f25e180]:
                - listitem [ref=f25e181]:
                  - generic [ref=f25e183]: Dual-encoder multimodal architecture
                - listitem [ref=f25e184]:
                  - generic [ref=f25e186]: Gated cross-modal fusion between inertial and spatial streams
                - listitem [ref=f25e187]:
                  - generic [ref=f25e189]: Variable-length sequence handling up to 700 timesteps
                - listitem [ref=f25e190]:
                  - generic [ref=f25e192]: Mixed precision training with cosine LR scheduling
                - listitem [ref=f25e193]:
                  - generic [ref=f25e195]: Label smoothing for ambiguous gesture boundaries
