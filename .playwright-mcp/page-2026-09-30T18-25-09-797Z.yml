              - generic [ref=f2e224]:
                - paragraph [ref=f2e225]: Wrist-worn sensing gives you an inertial stream and a coarse spatial stream that do not describe the same thing. The inertial channel is fast and noisy; the spatial channel is slow but grounded. Treating them as one flat feature vector throws away the structure of the problem.
                - paragraph [ref=f2e226]: Two encoders run independently — a temporal branch over the inertial signal and a convolutional branch over the spatial frames — and are merged through a gated cross-modal fusion layer that learns how much to trust each modality per timestep. Sequences are variable-length, so batching is handled around padding and masking rather than truncation.
                - paragraph [ref=f2e227]: Training runs under mixed precision with cosine learning-rate scheduling and label smoothing — the last of which matters here, because gesture boundaries in self-recorded data are inherently fuzzy.
                - list [ref=f2e228]:
                  - listitem [ref=f2e229]:
                    - generic [ref=f2e231]: Dual-encoder multimodal architecture
