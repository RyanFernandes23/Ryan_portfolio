              - generic [ref=f1e223]:
                - paragraph [ref=f1e224]: Wrist-worn sensing gives you an inertial stream and a coarse spatial stream that do not describe the same thing. The inertial channel is fast and noisy; the spatial channel is slow but grounded. Treating them as one flat feature vector throws away the structure of the problem.
                - paragraph [ref=f1e225]: Two encoders run independently — a temporal branch over the inertial signal and a convolutional branch over the spatial frames — and are merged through a gated cross-modal fusion layer that learns how much to trust each modality per timestep. Sequences are variable-length, so batching is handled around padding and masking rather than truncation.
                - paragraph [ref=f1e226]: Training runs under mixed precision with cosine learning-rate scheduling and label smoothing — the last of which matters here, because gesture boundaries in self-recorded data are inherently fuzzy.
                - list [ref=f1e227]:
                  - listitem [ref=f1e228]:
                    - generic [ref=f1e230]: Dual-encoder multimodal architecture
